[pytest]
# pytest Profile

# Test File Matching Mode
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test Directory
testpaths = tests

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Mark Definition
markers =
    unit: Unit Test
    integration: Integrated testing
    e2e: End-to-end testing
    slow: Slow test (required) API Call）
    mock: Usage mock Tests
    docker: Docker Environmental testing
    requires_service: Requires a real running backend service (in docker-test Phase Run）

# Coverage Configuration
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */.venv/*
    */migrations/*
    */config.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

