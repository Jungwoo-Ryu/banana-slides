# Build this maintained fork; optional overrides must name approved enterprise images.

services:
  backend:
    # Build the maintained backend.
    image: ${DOCKER_IMAGE_BACKEND:-sola-slides-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: banana-slides-backend
    ports:
      # Host Port:Internal Port of Container
      # Host port by BACKEND_PORT Control, inside the container fixed. 5000
      - "${BACKEND_PORT:-5011}:5000"
    # From .env The file automatically loads all environment variables
    env_file:
      - .env
    volumes:
      # Enduring database
      - ./backend/instance:/app/backend/instance
      # Enduring Uploaded Files
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banana-slides-network

  frontend:
    # Build the maintained frontend.
    image: ${DOCKER_IMAGE_FRONTEND:-sola-slides-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: banana-slides-frontend
    ports:
      - "${FRONTEND_PORT:-3011}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banana-slides-network

networks:
  banana-slides-network:
    driver: bridge

volumes:
  backend-data:
  uploads-data:
