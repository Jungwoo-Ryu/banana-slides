name: Bug Report / Issue feedback
description: Report a bug or issue / Report error or problem
labels: ["bug"]
body:
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method / Deployment pattern
      description: Where did you encounter this issue? / Where did you get this problem?？
      options:
        - Demo Website / Online Demo (bananaslides.online)
        - Docker Compose (docker-compose.yml)
        - Docker Compose with Pre-built Images (docker-compose.prod.yml)
        - Local Development / Local development (uv + npm)
        - Cloud Platform / Cloud platform deployment (Rain clouds and so on.)
        - Other / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description / Description of the problem
      description: Describe the issue you encountered / Describe the problems you’ve encountered.
      placeholder: What happened? / What happened?？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / Recurring Steps
      description: How can we reproduce this issue? / How does this come back?？
      placeholder: |
        1. Go to... / Enter...
        2. Click on... / Click...
        3. See error / I saw a mistake.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / Expected behaviour
      description: What did you expect to happen? / What do you expect to happen?？
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Log
      description: If applicable, paste relevant logs (docker logs, browser console, etc.) / Paste relevant logs, if applicable
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / Version
      description: Which version are you using? / Which version did you use?？
      placeholder: v0.4.0 or commit hash / v0.4.0 or commit hash
    validations:
      required: false
