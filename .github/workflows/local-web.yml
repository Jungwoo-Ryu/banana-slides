name: Go Web
on:
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build:check
      - run: npm --prefix frontend run lint:strict
      - run: npm --prefix frontend run test:run -- --maxWorkers=1
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Launch the Go backend and web UI using native cmd.exe
        shell: pwsh
        run: |
          $launcher = Start-Process cmd.exe -ArgumentList '/d /c start-web.bat --no-browser' -PassThru -RedirectStandardOutput launcher.log -RedirectStandardError launcher-error.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 240; $attempt++) {
              if ($launcher.HasExited) { throw 'Launcher exited before readiness' }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:5011/health -TimeoutSec 2
                $web = Invoke-WebRequest http://127.0.0.1:3011/ -TimeoutSec 2
                if ($health.data.runtime -eq 'go' -and $web.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ready) { throw 'Services did not become ready' }
          } finally {
            if (-not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F }
            Get-Content launcher.log
            Get-Content launcher-error.log
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: go-web-launcher-failures
          path: |
            launcher*.log
            .runtime/logs/
