name: Dependency Security
on:
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            backend/go.sum
            wails/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: go -C backend run ./cmd/sola-check
      - name: Frontend dependency advisories
        working-directory: frontend
        run: npm audit --package-lock-only --ignore-scripts --audit-level=low
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Go backend vulnerabilities
        working-directory: backend
        run: govulncheck ./...
      - name: Windows Wails dependency vulnerabilities
        working-directory: wails
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p frontend/dist
          echo '<html></html>' > frontend/dist/index.html
          govulncheck ./...
