[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-slides"
version = "0.9.0"
description = "Banana Slides – AI native PPT generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.1",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "requests[socks]>=2.34.2",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.9.0",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "waitress>=3.0.0",
    "python-pptx>=1.0.0",
    "python-dotenv>=1.2.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "reportlab>=4.1.0",
    "werkzeug>=3.1.9",
    "markitdown[docx,pptx,xlsx,xls]>=0.1.9",
    "tenacity>=9.0.0",
    "alembic>=1.13.0",
    "flask-migrate>=4.0.0",
    "img2pdf>=0.5.1",
    "pypdf>=6.21.4",
    "PyMuPDF>=1.27.1,<2",
    "socksio>=1.0.0",
    "opencv-python-headless>=4.13.0.92",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "flake8>=6.1.0",
    "black>=23.0.0",
]

[project.scripts]
banana-cli = "cli.banana_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
