services:
  sola:
    build:
      context: .
      dockerfile: Dockerfile.allinone
    env_file:
      - path: .env
        required: false
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3011}:5000'
    volumes:
      - sola-data:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
volumes:
  sola-data:
