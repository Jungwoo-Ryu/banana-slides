services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        GHCR_REGISTRY: ${GHCR_REGISTRY:-ghcr.io/}
        APT_MIRROR: ${APT_MIRROR:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
    container_name: banana-slides-backend
    ports:
      # Host Port:Internal Port of Container
      # Host port by BACKEND_PORT Control, inside the container fixed. 5000
      - "${BACKEND_PORT:-5011}:5000"
      # OpenAI OAuth callback server
      - "1455:1455"
    # From .env The file automatically loads all environment variables
    env_file:
      - .env
    # Uncomment below to use Vertex AI with a GCP service-account key
    # environment:
    #   - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-sa-key.json
    volumes:
      # Enduring database
      - ./backend/instance:/app/backend/instance
      # Enduring Uploaded Files
      - ./uploads:/app/uploads
      # Mount GCP service-account key (Vertex AI only — uncomment if needed)
      # - ./gcp-service-account.json:/app/gcp-sa-key.json:ro
    restart: unless-stopped
    healthcheck:
      # Health checks use internal fixed ports in containers 5000
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - banana-slides-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Windows Compatibility： Disable symbolic link following + Front-end build parameters
      args:
        DOCKER_BUILDKIT: 1
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: banana-slides-frontend
    ports:
      - "${FRONTEND_PORT:-3011}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - banana-slides-network

networks:
  banana-slides-network:
    driver: bridge

volumes:
  backend-data:
  uploads-data:
