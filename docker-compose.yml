services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - sola-data:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD, sola-server, --healthcheck, 'http://127.0.0.1:5000/health']
      interval: 15s
      timeout: 6s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3011}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  sola-data:
